# =============================================================================
# VT-SaiBER Docker Compose Configuration
# =============================================================================
# This file defines all containers and how they work together
#
# Services defined:
#   1. postgres  - PostgreSQL database
#   2. attackbox - Unified Kali + Metasploit MCP server
#   3. agents    - Python application (your agents)

# =============================================================================
# SERVICES (Containers)
# =============================================================================
services:

  # ---------------------------------------------------------------------------
  # PostgreSQL Database
  # ---------------------------------------------------------------------------
  # Stores: targets, findings, sessions, agent logs
  # Yi-Chen is responsible for schema.sql
  postgres:
    image: pgvector/pgvector:pg15     # Official PostgreSQL 15 image with pgvector extension
    container_name: vt-saiber-postgres
    
    # Environment variables passed to the container
    environment:
      POSTGRES_USER: ${DB_USER}       # Database username
      POSTGRES_PASSWORD: ${DB_PASSWORD}  # From .env file
      POSTGRES_DB: ${DB_NAME}         # Database name
    
    # Volumes: Persist data outside container
    volumes:
      # Named volume - Docker manages where data is stored
      - postgres_data:/var/lib/postgresql/data
      
      # Mount schema.sql - auto-runs on first startup
      # :ro means "read-only"
      - ./src/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    
    # Network: Join the vt-saiber-network
    networks:
      - vt-saiber-network
    
    # Ports: Map container port to host port
    # Format: "host_port:container_port"
    # This allows you to access DB from your laptop at localhost:5432
    ports:
      - "5432:5432" # From .env file
    
    # Health check: Docker periodically runs this command
    # If it fails, container is marked "unhealthy"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s      # Check every 5 seconds
      timeout: 5s       # Command must complete in 5 seconds
      retries: 5        # Try 5 times before marking unhealthy
    
    # Restart policy
    restart: unless-stopped

  knowledge_base:
    image: vt-saiber-agents
    pull_policy: never
    build:
      context: .
      dockerfile: docker/agents.Dockerfile
    container_name: vt-saiber-knowledge-base
    depends_on:
      - postgres
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}

      RAG_SYNC_MODE: "sync"                   # or "rebuild"
      RAG_SYNC_SOURCE_DIR: "src/database/testbed_docs"
    volumes:
      - ./src:/app/src:ro      # Read-only access for source code
    networks:
      - vt-saiber-network
    command: >
      sh -lc "
        echo '[kb-sync] Waiting for Postgres...';
        until pg_isready -h $$DB_HOST -U $$DB_USER -d $$DB_NAME; do
          sleep 2;
        done;
        echo '[kb-sync] Postgres is ready, running RAG '$$RAG_SYNC_MODE'...';
        python -m src.database.rag.rag_engine $$RAG_SYNC_MODE \
          --source-dir $$RAG_SYNC_SOURCE_DIR;
        echo '[kb-sync] KB sync done, exiting.';
      "

  # ---------------------------------------------------------------------------
  # Unified Attackbox MCP Server
  # ---------------------------------------------------------------------------
  attackbox:
    build:
      context: .
      dockerfile: docker/attackbox.Dockerfile

    container_name: vt-saiber-attackbox

    environment:
      - MSF_PASSWORD=${MSF_PASSWORD}
      - MSF_SERVER=127.0.0.1
      - MSF_PORT=55553
      - MSF_SSL=false
      - ATTACKBOX_MCP_HOST=0.0.0.0
      - ATTACKBOX_MCP_PORT=8080
      - ATTACKBOX_MCP_TRANSPORT=streamable-http

    networks:
      - vt-saiber-network

    ports:
      - "55553"
      - "8080"

    volumes:
      - msf_data:/root/.msf4
      - ./src:/app/src:ro
      - ./scripts/docker/start_attackbox.sh:/app/start_attackbox.sh:ro

    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8080"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 90s

    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Agents (Python Application)
  # ---------------------------------------------------------------------------
  # Your main application - runs Scout, Fuzzer, Striker, etc.
  # Sudip is responsible for src/main.py
  agents:
    image: vt-saiber-agents
    pull_policy: never
    build:
      context: .
      dockerfile: docker/agents.Dockerfile
    
    container_name: vt-saiber-agents
    
    # All environment variables your app needs
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - ATTACKBOX_MCP_URL=${ATTACKBOX_MCP_URL}
      - REPORT_EXPORT_DIR=/app/exports
      #- ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      #- OPENAI_API_KEY=${OPENAI_API_KEY}
    
    # Mount source code - allows live editing without rebuilding
    volumes:
      - ./src:/app/src:rw      # Read-write access
      - ./data:/app/data:rw
      - ./tests:/app/tests:rw
      - ./exports:/app/exports:rw
    
    networks:
      - vt-saiber-network
    
    # Dependencies: Wait for these to be healthy before starting
    depends_on:
      postgres:
        condition: service_healthy
      knowledge_base:
        condition: service_completed_successfully
      attackbox:
        condition: service_healthy
    
    # Command to run when container starts
    command: tail -f /dev/null
    
    restart: unless-stopped

# =============================================================================
# NETWORKS
# =============================================================================
# All containers join this network and can talk to each other by name
networks:
  vt-saiber-network:
    driver: bridge           # Standard Docker network driver
    ipam:                    # IP Address Management
      config:
        - subnet: 172.20.0.0/16  # IP range for containers

# =============================================================================
# VOLUMES
# =============================================================================
# Named volumes - Docker manages where data is actually stored
volumes:
  postgres_data:   # PostgreSQL database files
  msf_data:        # Metasploit configuration and modules
